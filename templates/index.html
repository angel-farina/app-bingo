<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo Bolillero (90)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<link rel="icon" type="image/png" href="/static/favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Estilos CSS */
body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  overflow-x: hidden;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.fade-in { animation: fadeIn 0.4s ease-in-out; }

#canvasContainer {
  width: 300px;
  height: 300px;
  margin: 0 auto;
  position: relative;
  cursor: pointer;
  flex-shrink: 0;
}

#bolillaCanvas {
  width: 100%;
  height: 100%;
  display: block;
}

.numero-overlay {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 5rem;
  font-weight: 900;
  color: white;
  text-shadow:
    3px 3px 6px rgba(0,0,0,0.8),
    -1px -1px 2px rgba(255,255,255,0.3);
  pointer-events: none;
  z-index: 10;
}

.bolilla-pequena {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #fff, #ff6b6b, #c92a2a);
  box-shadow:
    0 4px 10px rgba(0,0,0,0.3),
    inset 0 -4px 8px rgba(0,0,0,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  font-weight: 800;
  color: white;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
  /* Margen de 2px para que estén juntas */
  margin: 2px;
  animation: fadeIn 0.5s ease-in-out;
}

#resultado {
  background: linear-gradient(to right, #2563eb, #22d3ee);
  padding: 1.5rem 2rem;
  border-radius: 1.5rem;
  box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

.toast {
  border-radius: 1rem;
  backdrop-filter: blur(4px);
  opacity: 0.95;
}

.btn-bingo {
  background: linear-gradient(to right, #f093fb, #f5576c);
  box-shadow: 0 8px 15px rgba(0,0,0,0.3);
  transition: all 0.3s ease;
}

.btn-bingo:hover {
  transform: scale(1.05);
}

.btn-iniciar {
  background: linear-gradient(to right, #4facfe, #00f2fe);
  box-shadow: 0 8px 15px rgba(0,0,0,0.3);
}

.contador {
  font-size: 1.2rem;
  font-weight: 700;
  color: white;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}

</style>
</head>
<body class="min-h-screen flex items-center justify-center py-10">

<main class="bg-white/90 backdrop-blur-md shadow-2xl rounded-3xl p-8 w-full max-w-6xl fade-in text-center">
  <h1 class="text-5xl font-extrabold mb-8 text-transparent bg-clip-text bg-gradient-to-r from-blue-700 to-teal-400
">
    BINGO
  </h1>

  <div class="contador mb-6 bg-gradient-to-r from-blue-600 to-cyan-400 py-2 px-4 rounded-xl inline-block">
    <span id="contadorBolillas">Bolillas restantes: 90</span>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-[200px_1fr_200px] gap-4 items-start mt-2">

  <!-- Columna izquierda: botones -->
  <div class="flex flex-col gap-3 justify-center items-stretch w-full">
    <div class="text-center">
    <img src="/static/logo.png" alt="Logo" class="mx-auto w-60 opacity-90 transition-transform">
  </div>

    <button id="iniciarBtn" class="btn-iniciar text-white px-4 py-3 rounded-2xl text-base font-bold flex items-center justify-center gap-2">
      🔄 <span>Iniciar Bingo</span>
    </button>

    <button id="verBolillasBtn" class="bg-gradient-to-r from-green-400 to-blue-500 text-white px-4 py-3 rounded-2xl text-base font-bold hover:scale-105 transition-all flex items-center justify-center gap-2">
      👁️ <span>Ver Bolillas</span>
    </button>

    <button id="sacarBtn" class="btn-bingo text-white px-4 py-3 rounded-2xl text-base font-bold flex items-center justify-center gap-2">
      🎱 <span>Sacar Bolilla</span>
    </button>
  </div>

  <!-- Columna central -->
  <div class="flex flex-col items-center justify-center w-full">
    <div id="canvasContainer" class="mt-2">
      <canvas id="bolillaCanvas"></canvas>
      <div class="numero-overlay" id="numeroBolilla"></div>
    </div>

    <div id="resultado" class="text-5xl font-bold text-white mt-6 hidden"></div>
    
  </div>

  <!-- Columna derecha -->
  <div class="flex flex-col justify-start w-full">
    <h3 class="text-2xl font-extrabold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-700 to-teal-400">Últimas:</h3>
    <div id="ultimasBolillas" class="grid grid-cols-2 justify-items-center gap-x-0 gap-y-0.5 bg-gradient-to-r from-purple-100 to-pink-100 rounded-2xl shadow-inner p-1 min-h-[50px]">
    </div>
  </div>

</div> 
</main>

<div aria-live="polite" aria-atomic="true" class="position-fixed top-0 end-0 p-3" style="z-index:1050; width:300px;">
  <div id="toastContainer" class="toast-container"></div>
</div>

<div id="popupBolillas" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50">
  <div class="bg-white rounded-2xl p-6 w-full max-w-3xl max-h-[80vh] overflow-auto relative">
    <button id="cerrarPopup" class="absolute top-2 right-2 text-gray-500 hover:text-gray-800 font-bold text-2xl">&times;</button>
    <h3 class="text-2xl font-bold mb-6 text-center text-purple-600">Todas las Bolillas Salidas</h3>
    <div id="todasBolillas" class="flex flex-wrap justify-center gap-3"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
